# Participant registry for the review exchange. This file is the single
# model allow-list and the generation counter: actors are sessions that
# register themselves with `exchange.py join --model <slug>` and are named
# <slug>_<generation>[.<n>]; the helper derives message-id syntax, broadcast
# expansion, and default provenance from it. Adding a model is an edit here,
# never a code change.

protocol = "smusni-review-mail/v3"
# Mutable mail lives outside every checkout. `mail` is an ignored symlink in
# the primary checkout; linked worktrees find that same symlink through Git's
# common directory rather than creating their own mailbox.
spool = "mail"
# The current session generation. Whoever calls a full-pass review of the
# documents bumps this (a commit) before the fresh sessions are started; a
# session joining afterwards becomes <model>_<generation>[.<n>].
generation = 2

[models.codex]
active = true
display_name = "Codex"
client = "codex"
model = "session-selected"
broadcast_recipient = true

[models.fable]
active = true
display_name = "Fable"
client = "claude"
model = "claude-fable-5"
broadcast_recipient = true

[models.kimi]
active = true
display_name = "Kimi K3"
client = "kimi"
model = "kimi-code/k3"
broadcast_recipient = true

# Qwen has the smallest token quota: it is kept out of the regular code-review
# rotation and reserved for full-read milestones (human partner, 2026-08-28).
# The review rotation is Fable, Codex, and Kimi.
[models.qwen]
active = true
display_name = "Qwen 3.8 Max"
client = "qwen"
model = "qwen3.8-max-preview"
broadcast_recipient = true

[models.deepseek]
active = true
display_name = "DeepSeek V4 Pro"
client = "qwen"
model = "deepseek-v4-pro"
broadcast_recipient = true

# Grok is an active peer and broadcast recipient. This does not add it to the
# separately adjudicated Fable/Codex/Kimi regular review rotation.
[models.grok]
active = true
display_name = "Grok 4.6"
client = "grok"
model = "grok-4.6"
broadcast_recipient = true

# Gemini runs inside Google Antigravity; the workspace rule
# `.agents/rules/smusni-charter.md` loads the charter and binds the actor.
# Gemini is excluded from reviews (human partner, 2026-08-28): its verdicts do
# not count toward consensus and it is not named on review requests. It may
# take delegated mechanical work under a brief, reviewed by the rotation.
[models.gemini]
active = true
display_name = "Gemini"
client = "antigravity"
model = "session-selected"
broadcast_recipient = true

# The human partner may address any actor and adjudicates semantic forks,
# but is never a broadcast recipient and never owes an acknowledgement:
# messages addressed to `human` are listed as ADDRESSED, never pending.
[models.human]
active = true
display_name = "human partner"
client = "none"
model = "human"
sessions = false
broadcast_recipient = false
acknowledges = false
