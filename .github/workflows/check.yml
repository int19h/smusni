name: checks

on:
  push:
  pull_request:

jobs:
  documentation-and-redex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          version: "9.1"
      - name: Regenerate derived checker inputs
        run: |
          racket tools/smusni-redex/inventory.rkt --write
          racket tools/smusni-redex/extract.rkt --write
          git diff --exit-code
      - name: Run documentation and Redex checks
        run: tools/check-smusni

